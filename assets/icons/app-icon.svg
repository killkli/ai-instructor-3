<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景圓形 -->
  <circle cx="256" cy="256" r="240" fill="#4f46e5" stroke="#3730a3" stroke-width="8"/>
  
  <!-- 機器人頭部 -->
  <rect x="180" y="160" width="152" height="120" rx="20" fill="#ffffff"/>
  
  <!-- 機器人眼睛 -->
  <circle cx="210" cy="200" r="12" fill="#4f46e5"/>
  <circle cx="302" cy="200" r="12" fill="#4f46e5"/>
  
  <!-- 機器人嘴巴 -->
  <rect x="220" y="240" width="72" height="8" rx="4" fill="#4f46e5"/>
  
  <!-- 機器人天線 -->
  <line x1="256" y1="160" x2="256" y2="120" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="120" r="8" fill="#fbbf24"/>
  
  <!-- 書本圖示 -->
  <rect x="140" y="320" width="80" height="60" rx="4" fill="#ffffff"/>
  <rect x="145" y="325" width="70" height="50" rx="2" fill="#e5e7eb"/>
  <line x1="155" y1="340" x2="205" y2="340" stroke="#4f46e5" stroke-width="2"/>
  <line x1="155" y1="350" x2="195" y2="350" stroke="#4f46e5" stroke-width="2"/>
  <line x1="155" y1="360" x2="200" y2="360" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- 數學符號 -->
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">∑</text>
  
  <!-- 對話氣泡 -->
  <ellipse cx="380" cy="200" rx="40" ry="25" fill="#ffffff"/>
  <polygon points="340,210 350,200 350,220" fill="#ffffff"/>
  <text x="365" y="210" font-family="Arial, sans-serif" font-size="20" fill="#4f46e5">?</text>
</svg> 