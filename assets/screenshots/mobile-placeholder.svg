<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- 背景 -->
  <rect width="390" height="844" fill="#f8fafc"/>
  
  <!-- 狀態欄 -->
  <rect x="0" y="0" width="390" height="44" fill="#000000"/>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">9:41</text>
  <text x="370" y="30" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="end">100%</text>
  
  <!-- 標題欄 -->
  <rect x="0" y="44" width="390" height="60" fill="#4f46e5"/>
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="18" fill="white">☰</text>
  <text x="195" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">AI教學助理</text>
  <text x="340" y="80" font-family="Arial, sans-serif" font-size="18" fill="white">➕</text>
  
  <!-- 聊天區域 -->
  <rect x="0" y="104" width="390" height="640" fill="#ffffff"/>
  
  <!-- 訊息氣泡 -->
  <rect x="20" y="130" width="280" height="80" rx="20" fill="#4f46e5"/>
  <text x="160" y="155" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">歡迎使用AI教學助理！</text>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">我是你的學習夥伴</text>
  <text x="160" y="195" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">讓我們一起探索知識的世界吧！</text>
  
  <rect x="90" y="240" width="280" height="60" rx="20" fill="#e5e7eb"/>
  <text x="230" y="275" font-family="Arial, sans-serif" font-size="14" fill="#374151" text-anchor="middle">我想學習數學</text>
  
  <!-- 輸入區域 -->
  <rect x="0" y="744" width="390" height="100" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="20" y="764" width="300" height="40" rx="20" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="170" y="785" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">輸入您的問題...</text>
  <circle cx="350" cy="784" r="18" fill="#4f46e5"/>
  <text x="350" y="790" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">➤</text>
</svg> 